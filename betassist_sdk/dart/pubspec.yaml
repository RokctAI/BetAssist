version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter

  # UI Animations
  flip_card: ^0.7.0

  # Hardware Sensors (Gyroscope)
  get_it: ^9.2.0
  core_sdk:
    path: ../core
  onboarding_sdk:
    path: ../onboarding
  hardware_sdk:
    path: ../hardware





dependency_overrides:
  http: ^1.2.0
